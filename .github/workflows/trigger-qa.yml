name: Post-Deployment QA Trigger

on:
  push:
    branches:
      - main
      - master

jobs:
  trigger-qa-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render Deployment
        # Pauses the script for 3 minutes to give Render time to put your code live
        run: sleep 180

      - name: Trigger QA Automation
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.QA_TRIGGER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bhagyashree-ranganatha/api-test-automation/actions/workflows/qa-tests.yml/dispatches \
            -d '{"ref":"main"}'